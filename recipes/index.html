<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Book</title>
    <meta name="description" content="A cozy recipe book website featuring delicious dishes like apple crisp, with categories, ratings, and easy‑to‑follow instructions.">

    <link rel="stylesheet" href="index.css">
    <script src="index.js" defer></script>
    
    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Recipe Book">
    <meta property="og:description" content="A cozy recipe book website featuring delicious dishes like apple crisp, with categories, ratings, and easy‑to‑follow instructions.">
    <meta property="og:url" content="https://alisaishizaka.github.io/wdd131/recipes">
    <meta property="og:image" content="social-preview-image.png">

    <!-- X Card -->
    <meta name="twitter:card" content="Social Preview Image">
    <meta name="twitter:title" content="Recipe Book">
    <meta name="twitter:description" content="A cozy recipe book website featuring delicious dishes like apple crisp, with categories, ratings, and easy‑to‑follow instructions.">
    <meta name="twitter:image" content="social-preview-image.png">

    <!-- One favicon (ICO works everywhere) -->
    <link rel="icon" href="images/favicon.ico">

    <!-- One Apple Touch Icon (iOS home screen) -->
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
                
</head>
<body>

    <header>
        <img src="images/recipe-book.png" alt="recipe book">
        <h1><span class="header-big">R</span>ECIPE<span class="header-big">B</span>OOK</h1>
    </header>

    <div class="search-bar">
        <input type="text" placeholder="Find a recipe" class="search-input">
        <button class="search-recipe">
            <img src="images/search.svg" alt="search icon">
        </button>
    </div>

    <hr>

    <main>
        <section class="recipes">
        
        </section>
    </main>



    <footer>
      
        <a href="https://www.flaticon.com/free-icons/recipe" title="recipe icons">Recipe icons created by Freepik - Flaticon</a>   
        
        
        <div class="social">
        <!-- Social media icons provided under CC from https://www.iconfinder.com/AlfredoCreates  -->
        <a href="#"><img src="images/instagram_icon.svg" alt="instagram icon"></a>
        <a href="#"><img src="images/youtube_icon.svg" alt="youtube icon"></a>
        <a href="#"><img src="images/pinterest_icon.svg" alt="pinterest icon"></a>
        </div>                  
                  
    </footer>
    
</body>
</html>
